[project]
name = "lead-talent-api"
version = "0.1.0"
description = "LEAD Talent API (módulo 1: registro de estudiantes y resume)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "openai>=3.55.1",
  "azure-identity>=1.27.0",
  "pypdf>=7.1.1",
  "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# El test contra Azure no corre por defecto. Para correrlo: uv run pytest -m azure
markers = ["azure: llama a Azure OpenAI de verdad (usa las variables de backend/.env)"]
addopts = "-m 'not azure'"

[tool.ruff]
line-length = 100
target-version = "py312"
