<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Qué buscas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.28 0.05 272)}a:hover{color:oklch(0.52 0.2 287)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: oklch(0.975 0.008 272); color: oklch(0.28 0.05 272); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="padding: 52px 24px 0; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: oklch(0.5 0.03 272);">PASO 5 DE 6</span>
    <a href="Bienvenida.dc.html" style="font-size: 14px; padding: 8px 14px; border-radius: 9999px; box-shadow: 0 0 0 1px oklch(0.8 0.02 272); text-decoration: none;">Guardar y salir</a>
  </div>

  <div style="flex-grow: 1; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2;">¿Qué buscas?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: oklch(0.5 0.03 272);">Así te mostramos oportunidades que te sirven.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; font-weight: 600;">Caminos que te interesan <span style="font-weight: 400; color: oklch(0.5 0.03 272);">(hasta 5)</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.toggle}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; font-weight: 600;">Disponibilidad</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 12px; background: oklch(0.94 0.012 272);">
        <sc-for list="{{avail}}" as="a" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: oklch(0.995 0.004 272); border-radius: 16.8px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 0 0 1px oklch(0.28 0.05 272 / 0.1);">
      <input id="qb-visible" type="checkbox" checked="{{visible}}" onChange="{{toggleVisible}}" style="width: 22px; height: 22px; margin: 1px 0 0; flex-shrink: 0; accent-color: oklch(0.52 0.2 287); cursor: pointer;">
      <label for="qb-visible" style="display: flex; flex-direction: column; gap: 4px; cursor: pointer;">
        <span style="font-size: 14px; font-weight: 600; line-height: 1.4;">Quiero que empresas aliadas de LEAD vean mi perfil y mi CV</span>
        <span style="font-size: 12px; line-height: 1.5; color: oklch(0.5 0.03 272);">Apagado por defecto. Puedes cambiarlo cuando quieras.</span>
      </label>
    </div>
  </div>

  <div style="padding: 0 0 36px;">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 0 0 20px;">
      <div style="height: 4px; background: oklch(0.52 0.2 287);"></div>
      <div style="height: 4px; background: oklch(0.52 0.2 287);"></div>
      <div style="height: 4px; background: oklch(0.52 0.2 287);"></div>
      <div style="height: 4px; background: oklch(0.52 0.2 287);"></div>
      <div style="height: 4px; background-image: linear-gradient(90deg, oklch(0.5584 0.2066 286.65), oklch(0.487 0.2087 322.04));"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
    </div>
    <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: center;">
      <a href="Skills.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: underline; padding: 12px 4px;">Atrás</a>
      <a href="PerfilListo.dc.html" style="height: 48px; padding: 0 28px; border-radius: 12px; background-image: linear-gradient(120deg, oklch(0.5584 0.2066 286.65), oklch(0.487 0.2087 322.04)); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center;">Terminar</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { roles: { 'Data Science': true }, avail: 'practicas', visible: false }; }
renderVals() {
  const s = this.state;
  const chip = 'min-height: 40px; padding: 8px 14px; border-radius: 9.6px; border: none; font-family: inherit; font-size: 14px; cursor: pointer; ';
  const roleList = ['Software Engineer', 'Data Science', 'Product Manager', 'UI/UX', 'DevOps', 'Research', 'Marketing', 'Community'];
  const picked = roleList.filter((r) => s.roles[r]).length;
  const seg = 'min-height: 40px; border-radius: 9.6px; border: none; font-family: inherit; font-size: 13px; cursor: pointer; ';
  const availList = [['practicas', 'Prácticas'], ['part', 'Medio tiempo'], ['full', 'Tiempo completo']];
  return {
    visible: s.visible,
    toggleVisible: () => this.setState({ visible: !s.visible }),
    roles: roleList.map((r) => ({
      label: r,
      pressed: s.roles[r] ? 'true' : 'false',
      style: chip + (s.roles[r] ? 'background: oklch(0.5584 0.2066 286.65 / 0.14); color: oklch(0.45 0.2 287); font-weight: 600;' : 'background: oklch(0.94 0.012 272); color: oklch(0.28 0.05 272);'),
      toggle: () => { if (!s.roles[r] && picked >= 5) return; this.setState({ roles: { ...s.roles, [r]: !s.roles[r] } }); }
    })),
    avail: availList.map(([id, label]) => ({
      label,
      pressed: s.avail === id ? 'true' : 'false',
      style: seg + (s.avail === id ? 'background: oklch(0.995 0.004 272); color: oklch(0.28 0.05 272); font-weight: 600; box-shadow: 0 1px 2px oklch(0.28 0.05 272 / 0.15);' : 'background: transparent; color: oklch(0.45 0.03 272);'),
      pick: () => this.setState({ avail: id })
    }))
  };
}
}
</script>
</body>
</html>
