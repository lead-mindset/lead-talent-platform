<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Quién eres</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.28 0.05 272)}a:hover{color:oklch(0.52 0.2 287)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: oklch(0.975 0.008 272); color: oklch(0.28 0.05 272); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="padding: 52px 24px 0; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: oklch(0.5 0.03 272);">PASO 1 DE 6</span>
    <a href="Bienvenida.dc.html" style="font-size: 14px; padding: 8px 14px; border-radius: 9999px; box-shadow: 0 0 0 1px oklch(0.8 0.02 272); text-decoration: none;">Guardar y salir</a>
  </div>

  <div style="flex-grow: 1; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2;">¿Cuál te describe mejor?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: oklch(0.5 0.03 272);">Así mostramos tu perfil a los reclutadores correctos.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{options}}" as="item" hint-placeholder-count="4">
        <button type="button" onClick="{{item.pick}}" style="{{item.style}}">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: oklch(0.5584 0.2066 286.65 / 0.12); color: oklch(0.52 0.2 287); display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 16px;">{{item.mark}}</span>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.3; text-align: left;">{{item.label}}</span>
          <span style="font-size: 12px; line-height: 1.4; text-align: left; color: oklch(0.5 0.03 272);">{{item.hint}}</span>
        </button>
      </sc-for>
    </div>

    <div style="background: oklch(0.995 0.004 272); border-radius: 16.8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 0 1px oklch(0.28 0.05 272 / 0.1);">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 13px; font-weight: 600;">Tu perfil</span>
        <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; color: oklch(0.52 0.2 287);">10%</span>
      </div>
      <div style="height: 6px; border-radius: 9999px; background: oklch(0.9 0.015 272);">
        <div style="width: 10%; height: 6px; border-radius: 9999px; background-image: linear-gradient(90deg, oklch(0.5584 0.2066 286.65), oklch(0.487 0.2087 322.04));"></div>
      </div>
      <span style="font-size: 13px; line-height: 1.45; color: oklch(0.5 0.03 272);">Cada paso te acerca a aparecer en las búsquedas de empresas aliadas.</span>
    </div>
  </div>

  <div style="padding: 0 0 36px;">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 0 0 20px;">
      <div style="height: 4px; background-image: linear-gradient(90deg, oklch(0.5584 0.2066 286.65), oklch(0.487 0.2087 322.04));"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
      <div style="height: 4px; background: oklch(0.9 0.015 272);"></div>
    </div>
    <div style="padding: 0 24px; display: flex; justify-content: space-between; align-items: center;">
      <a href="Bienvenida.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: underline; padding: 12px 4px;">Atrás</a>
      <a href="SubeCV.dc.html" style="height: 48px; padding: 0 28px; border-radius: 12px; background-image: linear-gradient(120deg, oklch(0.5584 0.2066 286.65), oklch(0.487 0.2087 322.04)); color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center;">Siguiente</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'uni' }; }
renderVals() {
  const base = 'min-height: 150px; padding: 16px; border-radius: 16.8px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; font-family: inherit; color: oklch(0.28 0.05 272); border: none; ';
  const on = base + 'background: oklch(0.5584 0.2066 286.65 / 0.1); box-shadow: 0 0 0 2px oklch(0.52 0.2 287);';
  const off = base + 'background: oklch(0.995 0.004 272); box-shadow: 0 0 0 1px oklch(0.28 0.05 272 / 0.12);';
  const xs = [
    { id: 'uni', mark: 'U', label: 'Estudiante universitario', hint: 'Pregrado en curso' },
    { id: 'grad', mark: 'G', label: 'Recién graduado', hint: 'Menos de 2 años' },
    { id: 'pos', mark: 'P', label: 'Posgrado', hint: 'Maestría o doctorado' },
    { id: 'prof', mark: 'J', label: 'Profesional joven', hint: 'Busco mi siguiente paso' }
  ];
  return {
    options: xs.map((x) => ({ ...x, style: this.state.picked === x.id ? on : off, pick: () => this.setState({ picked: x.id }) }))
  };
}
}
</script>
</body>
</html>
